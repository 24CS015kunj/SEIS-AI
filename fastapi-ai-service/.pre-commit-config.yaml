# Runs automatically on `git commit` once installed (see Task 2 "Development
# Workflow" — `pre-commit install`). Mirrors exactly what CI runs, so a
# failure is caught locally in seconds instead of after a push (§27
# Maintainability).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic==2.10.4]
        exclude: ^tests/