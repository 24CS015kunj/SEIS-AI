name: Qdrant Cloud keepalive

on:
  workflow_dispatch:
  # Twice weekly leaves headroom below Qdrant Free's one-week inactivity window.
  schedule:
    - cron: "20 0 * * 1,4"

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Qdrant collection list over verified HTTPS
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, ssl, time, urllib.error, urllib.request, urllib.parse
          endpoint = os.environ.get("QDRANT_URL", "").rstrip("/")
          token = os.environ.get("QDRANT_API_KEY", "")
          parsed = urllib.parse.urlsplit(endpoint)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username
              or parsed.password or parsed.query or parsed.fragment
              or parsed.path or not token):
              raise SystemExit("Configure valid QDRANT_URL and QDRANT_API_KEY repository secrets")
          context = ssl.create_default_context()
          errors = []
          for attempt in range(1, 4):
              request = urllib.request.Request(
                  endpoint + "/collections",
                  headers={"api-key": token, "User-Agent": "seis-ai-keepalive"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20, context=context) as response:
                      if 200 <= response.status < 300:
                          print(f"Qdrant keepalive succeeded on attempt {attempt}")
                          break
                      raise RuntimeError(f"Unexpected status: {response.status}")
              except urllib.error.HTTPError as error:
                  errors.append(f"HTTP {error.code}")
                  if error.code in {401, 403}:
                      raise SystemExit(
                          "Qdrant keepalive failed: verify QDRANT_API_KEY permissions"
                      ) from None
              except Exception as error:
                  errors.append(type(error).__name__)
              if attempt < 3:
                  time.sleep(5 * attempt)
          else:
              detail = errors[-1] if errors else "unknown error"
              raise SystemExit(
                  f"Qdrant keepalive failed after retries; last error: {detail}"
              ) from None
          PY
