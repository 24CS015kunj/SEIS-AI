version: '3.8'

services:
  api:
    build:
      context: ./fastapi-ai-service
      dockerfile: Dockerfile
    container_name: fastapi-api
    ports:
      - "8000:8000"
    volumes:
      # Map the source code for hot-reloading
      - ./fastapi-ai-service:/app
      # Do not override the installed node_modules/python packages in the container with the local one (if any)
      - /app/.venv
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - TASK_QUEUE_BROKER_URL=redis://redis:6379/0
      # Ensure python output is visible immediately in the logs
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - chromadb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  chromadb:
    # Pinned to match ADR-004/06_DEPLOYMENT_GUIDE.md exactly. `:latest`
    # previously resolved to server v1.0.0, incompatible with the pinned
    # `chromadb==0.6.2` Python client (requirements-vectorstore.txt) --
    # confirmed via a real `KeyError: '_type'` on collection creation in
    # the prior infrastructure audit. 0.6.3 matches the client.
    image: chromadb/chroma:0.6.3
    container_name: fastapi-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped

volumes:
  chromadata:
