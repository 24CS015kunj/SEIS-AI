# Local development only. Render uses backend/ and fastapi-ai-service/ Dockerfiles;
# Vercel builds frontend/ directly. Managed Qdrant and Upstash are read from
# fastapi-ai-service/.env, which is mounted into the development API container.

services:
  # Python 3.13 FastAPI AI Microservice (Task #7 / Task #8)
  api:
    build:
      context: ./fastapi-ai-service
      dockerfile: Dockerfile
      target: development
      args:
        INSTALL_LEGACY_CHROMA: ${INSTALL_LEGACY_CHROMA:-false}
    container_name: fastapi-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./fastapi-ai-service:/app
      - /app/.venv
    environment:
      - SERVICE_ENV=development
      - EXPRESS_BASE_URL=http://backend:5000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Node.js Express Backend Gateway (Task #8)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seis-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URL=${MONGODB_URL:?Set MONGODB_URL in the local .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the local .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the local .env}
      - FASTAPI_BASE_URL=http://api:8000
      - FASTAPI_INTERNAL_API_KEY=${FASTAPI_INTERNAL_API_KEY:?Set FASTAPI_INTERNAL_API_KEY in the local .env}
      # The Dockerized frontend is nginx on port 80 (http://localhost), not
      # the Vite dev server on :5173 -- this value is both the CORS allowed
      # origin (app.js) and where githubCallback redirects the browser with
      # the token fragment after a successful GitHub exchange (auth.controller.js).
      # The old :5173 default pointed both of those at a port nothing in
      # Docker listens on.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # GitHub OAuth (auth.controller.js) -- previously absent from this
      # service entirely, so the containerized backend had no client
      # id/secret and built redirect_uri="undefined". The callback URL is
      # the same browser-facing value as local dev (backend/.env) because
      # Express publishes port 5000 identically in both environments; only
      # FRONTEND_URL differs between them.
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in the local .env}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in the local .env}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:5000/api/auth/github/callback?redirect=true}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # React 19 Frontend Web Client (Task #8)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    container_name: seis-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this image's /etc/hosts resolves
      # "localhost" to ::1 first, but nginx only listens on 0.0.0.0 (IPv4) --
      # wget then hits a real IPv6 connection-refused, permanently failing
      # the healthcheck despite nginx serving real traffic correctly over
      # IPv4 the whole time. This compose-level healthcheck overrides the
      # Dockerfile's own HEALTHCHECK instruction, so both were fixed.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Redis Cache & Celery Broker
  redis:
    profiles: ["legacy-local"]
    image: redis:7-alpine
    container_name: fastapi-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Chroma Vector Database
  chromadb:
    profiles: ["legacy-local"]
    image: chromadb/chroma:0.6.3
    container_name: fastapi-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  chromadata:
  redisdata:
