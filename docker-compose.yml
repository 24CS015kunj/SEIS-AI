version: '3.8'

services:
  api:
    build:
      context: ./fastapi-ai-service
      dockerfile: Dockerfile
    container_name: fastapi-api
    ports:
      - "8000:8000"
    volumes:
      # Map the source code for hot-reloading
      - ./fastapi-ai-service:/app
      # Do not override the installed node_modules/python packages in the container with the local one (if any)
      - /app/.venv
    env_file:
      - ./fastapi-ai-service/.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - TASK_QUEUE_BROKER_URL=redis://redis:6379/0
      # Ensure python output is visible immediately in the logs
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - chromadb
    restart: unless-stopped

  worker:
    # Task 40: the Celery worker that actually consumes the ingestion
    # jobs `api` (Task 30) enqueues. Same build context/Dockerfile/image
    # as `api` -- only the container command differs -- so the worker
    # always ships with the exact same application code (no separate
    # Dockerfile to keep in sync).
    build:
      context: ./fastapi-ai-service
      dockerfile: Dockerfile
    container_name: fastapi-worker
    command: >
      celery -A app.infra.queue.task_queue worker
      --include=app.tasks.ingestion
      --queues=ingestion
      --loglevel=info
    volumes:
      - ./fastapi-ai-service:/app
      - /app/.venv
    env_file:
      - ./fastapi-ai-service/.env
    environment:
      # Same Docker-service-name connectivity as `api` -- the worker
      # reads/writes the exact same Redis (status records, locks,
      # broker) and ChromaDB (vector upserts) `api` uses, per Task 40's
      # "update the SAME status record" / "reuse the existing
      # ChromaClient" requirements.
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - TASK_QUEUE_BROKER_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - chromadb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  chromadb:
    # Pinned to match ADR-004/06_DEPLOYMENT_GUIDE.md exactly. `:latest`
    # previously resolved to server v1.0.0, incompatible with the pinned
    # `chromadb==0.6.2` Python client (requirements-vectorstore.txt) --
    # confirmed via a real `KeyError: '_type'` on collection creation in
    # the prior infrastructure audit. 0.6.3 matches the client.
    image: chromadb/chroma:0.6.3
    container_name: fastapi-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped

volumes:
  chromadata:
